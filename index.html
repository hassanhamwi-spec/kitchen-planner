<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b5651d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مطبخ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>مصمم المطابخ</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#222;--mut:#777;--acc:#b5651d;--acc2:#8f4e14;--line:#ddd;--ok:#2a7d2a;--bad:#c00;--warn:#b86e00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(46px + env(safe-area-inset-bottom));font-size:15px;line-height:1.35}
header{background:var(--acc);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:0;z-index:6}
header .hbrand{display:flex;align-items:center;gap:10px;min-width:0}
header #hdrLogo{width:38px;height:38px;border-radius:9px;flex:none;object-fit:cover;box-shadow:0 0 0 1.5px #e9c46a}
header #hdrTitle{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:#fff;color:var(--acc);border:0;border-radius:8px;padding:6px 12px;font-weight:700;font-size:15px;flex:none}
nav{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:calc(52px + env(safe-area-inset-top));z-index:5;-webkit-overflow-scrolling:touch}
nav button{white-space:nowrap;border:1px solid var(--line);background:#fafafa;border-radius:20px;padding:8px 13px;font-size:14px;flex:none;color:var(--ink)}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{padding:12px;max-width:760px;margin:0 auto}
#banner{background:#fff3d6;padding:8px 12px;text-align:center;font-size:14px}
#banner button{margin-inline-start:8px;padding:6px 12px}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
.card.info{background:#fff8ea;border:1px solid #f0d9ac}
.card.sel{border:2px solid var(--acc)}
h2{font-size:16px;margin:0 0 10px}
.mut{color:var(--mut);font-size:13px}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}.warn{color:var(--warn);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.f{min-width:0}.f.full{grid-column:1/-1;margin-bottom:8px}
label{font-size:12.5px;color:var(--mut);display:block;margin-bottom:2px}
input[type=text],select,textarea{width:100%;font-size:16px;padding:9px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-family:inherit;min-height:42px}
textarea{resize:vertical}
input[type=color]{width:100%;height:42px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff}
.chk{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink);margin:6px 0}
.chk input{width:22px;height:22px}
button{font-family:inherit;cursor:pointer}
button.p{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:700;min-height:44px}
button.s{background:#eee;color:var(--ink);border:0;border-radius:10px;padding:10px 12px;font-size:15px;min-height:44px}
button.d{background:#fde8e8;color:#b00;border:0;border-radius:10px;padding:10px 12px;font-size:16px;min-height:44px}
button.sm{padding:6px 12px;min-height:36px;font-size:15px}
button.wide{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:#fafafa;border-radius:10px;padding:10px 6px;font-size:14px;min-height:44px;color:var(--ink)}
.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
.wallseg{margin-bottom:12px;overflow-x:auto}
.it{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px;background:#fcfbf8}
.r1{display:grid;grid-template-columns:24px 1fr 1.35fr 1fr;gap:6px;align-items:end}
.r1.c3{grid-template-columns:1fr 1fr 1fr;margin-bottom:6px}
.r1.c4{grid-template-columns:1fr 1fr;margin-top:6px}
.idx{font-weight:700;color:var(--acc);align-self:center;text-align:center}
.r2{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.acts{display:flex;align-items:flex-end;justify-content:flex-end}
.sum{font-size:14px;margin:8px 0}
.svgbox{margin:8px 0;border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden}
.svgbox.sheetbox{margin:8px 0}
details summary{cursor:pointer;font-weight:700;padding:4px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:center}
th{background:#f0ebe0;font-size:12px}
td:first-child,th:first-child{text-align:start}
.ct td:nth-child(2),.ct th:nth-child(2){text-align:start}
table.qt td:last-child{text-align:end;white-space:nowrap}
table.qt th:last-child{text-align:end}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.clr span{font-size:12.5px;color:var(--mut);display:block;margin-bottom:2px}
.logo img{max-height:70px;max-width:160px;margin:8px 0;display:block}
.page{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
.phead{display:flex;align-items:center;gap:12px;background:var(--acc);color:#fff;border-radius:10px;padding:12px;margin-bottom:12px}
.phead img{height:56px;width:56px;object-fit:contain;background:#fff;border-radius:8px;padding:2px}
.phead .shop{font-size:20px;font-weight:700}.phead .phone{opacity:.9}
.pcust{text-align:center;margin-bottom:8px;font-size:18px}
.swatches{display:flex;justify-content:center;gap:18px;margin:12px 0;flex-wrap:wrap}
.swatches div{text-align:center;font-size:13px}
.swatches i{display:block;width:44px;height:44px;border-radius:10px;border:1px solid #666;margin:0 auto 4px}
.pprice{margin-top:10px}.pnotes{margin-top:10px;padding:10px;background:#faf7f0;border-radius:8px;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:10px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90%;text-align:center;font-size:14px}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#ver{text-align:center;color:var(--mut);font-size:12px;margin-top:6px}
@media print{
  header,nav,.noprint,#banner,#ver,#toast{display:none!important}
  body{background:#fff;padding:0}
  main{padding:0;max-width:none}
  .card,.page{box-shadow:none;break-inside:avoid}
  .svgbox{break-inside:avoid}
  @page{margin:10mm}
}

tr.zero td{color:var(--warn)}
.code{unicode-bidi:isolate}
.curbox{margin-top:10px}.curbox .seg{margin:4px 0}
.v3box{margin:8px 0;border:1px solid var(--line);border-radius:8px;background:#f4f1ea;overflow:hidden}.v3box canvas{width:100%;aspect-ratio:4/3;display:block;touch-action:none;cursor:grab}.v3bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px;background:#fff;flex-wrap:wrap}
h3{font-size:14px;margin:12px 0 4px;color:var(--acc2)}

#splash{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 30%,#8f4e14 0,#5a2f0c 55%,#2e1706 100%);color:#fbeed1;animation:spIn .7s ease both;cursor:pointer}
#splash.out{opacity:0;transition:opacity .45s}
@keyframes spIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.sp-frame{position:relative;width:100%;max-width:420px;min-height:min(560px,88vh);border:2px solid #e9c46a;border-radius:18px;outline:1px solid rgba(233,196,106,.5);outline-offset:6px;display:flex;align-items:center;justify-content:center;padding:34px 22px;background:rgba(255,255,255,.03)}
.sp-c{position:absolute;width:44px;height:44px}.sp-c svg{width:100%;height:100%;display:block}
.sp-c.tl{top:6px;left:6px}.sp-c.tr{top:6px;right:6px;transform:scaleX(-1)}.sp-c.bl{bottom:6px;left:6px;transform:scaleY(-1)}.sp-c.br{bottom:6px;right:6px;transform:scale(-1,-1)}
.sp-in{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;animation:spUp 1s .25s ease both}
@keyframes spUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sp-star{width:92px;height:92px;margin-bottom:6px;animation:spRot 24s linear infinite}
@keyframes spRot{to{transform:rotate(360deg)}}
.sp-gift{font-family:"DecoType Naskh","Geeza Pro","Damascus","Noto Naskh Arabic","Amiri",Georgia,serif;font-size:44px;font-weight:700;color:#e9c46a;line-height:1.1;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.sp-lbl{font-size:16px;opacity:.8;margin-top:8px}
.sp-name{font-family:"DecoType Naskh","Geeza Pro","Damascus","Noto Naskh Arabic","Amiri",Georgia,serif;font-size:34px;font-weight:700;line-height:1.25;color:#fff7e3}
.sp-name.big{font-size:38px;color:#ffe08a}
.sp-sub{font-size:20px;color:#e9c46a;margin-top:-2px}
.sp-div{display:flex;align-items:center;gap:10px;width:70%;margin:10px 0 2px}.sp-div i{flex:1;height:1px;background:linear-gradient(90deg,transparent,#e9c46a,transparent)}
.sp-app{margin-top:18px;font-size:15px;letter-spacing:.4px;opacity:.75;border-top:1px solid rgba(233,196,106,.4);padding-top:10px}
.sp-hint{margin-top:10px;font-size:13px;opacity:.6;animation:spBlink 2s ease-in-out infinite}
@keyframes spBlink{50%{opacity:.25}}
#splash2{position:fixed;inset:0;z-index:101;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;cursor:pointer;animation:spIn .7s ease both}
#splash2.out{opacity:0;transition:opacity .5s}
.sp-logo{width:min(94vw,86vh,620px);height:auto;display:block;animation:spLogo 1.1s .1s ease both}
.sp-hint2{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom));font-size:13px;color:#e9c46a;opacity:.55;animation:spBlink 2s ease-in-out infinite}
@keyframes spLogo{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@media print{#splash,#splash2{display:none!important}}

/* ---- v2.6 ---- */
.r1.q4{grid-template-columns:1fr 1fr 1fr 1fr;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chips button{min-height:36px;padding:4px 12px;border:1px solid var(--line);background:#fafafa;border-radius:18px;color:var(--ink)}
.chips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.bth{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#eee;cursor:pointer}
.phi{display:flex;gap:8px;align-items:center}.phi .f{flex:1}
.phview{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:10px}.phview img{max-width:100%;max-height:100%;object-fit:contain}
.seq{font-size:13px;margin:4px 0 12px;line-height:1.7}.seq b{display:block;color:var(--acc2)}
td.cds{font-size:12px;color:var(--mut);word-break:break-all}
.pterms{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;font-size:13px;line-height:1.7}
details.card>summary{font-weight:700;cursor:pointer;padding:4px 0}
#banner button.p{margin-inline-start:8px}
.lblgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}
.lbl{border:1px dashed #777;border-radius:6px;padding:5px 7px;background:#fff;break-inside:avoid;font-size:12px}
.lbl .lt{display:flex;justify-content:space-between;gap:6px;align-items:baseline}.lbl .lt b{font-size:14px}
.lbl .ls{font-size:16px;font-weight:700;margin:2px 0}
.lbl .lm{display:flex;gap:6px;align-items:center}.lbl .lm svg{width:64px;height:auto;flex:none}
.lbl .le{font-weight:700}.lbl .lg{color:var(--mut);font-size:11px}
@media print{
  body.plabels main>*:not(.lblcard){display:none!important}
  body.plabels .lblcard{box-shadow:none}
  body.plabels .lblcard h2{display:none}
  body.plabels .lblgrid{grid-template-columns:repeat(3,1fr);gap:4px}
  .pterms{break-inside:avoid}
}

details.upx{margin-top:6px;border-top:1px dashed var(--line);padding-top:4px}details.upx>summary{font-size:13px;color:var(--acc2);cursor:pointer;padding:4px 0}

</style>
</head>

/* ---------------- persistence ---------------- */
function deepAssign(base, over) {
  const out = JSON.parse(JSON.stringify(base));
  if (over && typeof over === 'object') Object.keys(over).forEach(k => {
    if (over[k] && typeof over[k] === 'object' && !Array.isArray(over[k]) && out[k] && typeof out[k] === 'object') out[k] = deepAssign(out[k], over[k]);
    else out[k] = over[k];
  });
  return out;
}
function norm(P) {
  const B = M.newProject('');
  P.id = P.id || M.uid(); P.name = String(P.name || ''); P.created = P.created || Date.now(); P.updated = P.updated || Date.now();
  P.dims = deepAssign(M.DEF_DIMS, P.dims); Object.keys(P.dims).forEach(k => { P.dims[k] = M.num(P.dims[k]); });
  P.finish = deepAssign(B.finish, P.finish);
  P.price = deepAssign(B.price, P.price); if (!Array.isArray(P.price.extras)) P.price.extras = [];
  P.price.mode = P.price.mode === 'piece' ? 'piece' : 'meter'; P.price.cur = P.price.cur === 'B' ? 'B' : 'A';
  P.layout = M.LAYOUTS.includes(P.layout) ? P.layout : 'I';
  const n = M.NW[P.layout];
  P.walls = (Array.isArray(P.walls) ? P.walls : []).slice(0, n);
  while (P.walls.length < n) P.walls.push(M.newWall(300));
  P.walls.forEach(w => {
    w.len = M.num(w.len) || 300; w.slope = deepAssign({ diff: 0, high: 'L' }, w.slope); w.slope.diff = M.num(w.slope.diff);
    ['base', 'upper', 'obs'].forEach(k => { if (!Array.isArray(w[k])) w[k] = []; });
    ['base', 'upper'].forEach(k => w[k].forEach(it => { it.h = M.num(it.h); it.bot = M.num(it.bot); it.w = M.num(it.w); it.n = Math.max(1, Math.round(M.num(it.n)) || 1); it.type = it.type || 'door'; it.label = it.label || ''; }));
    w.obs.forEach(o => { o.x = M.num(o.x); o.w = M.num(o.w); o.h = M.num(o.h); o.sill = M.num(o.sill); o.depth = M.num(o.depth); });
  });
  const nc = M.NC(P.layout);
  P.corners = (Array.isArray(P.corners) ? P.corners : []).slice(0, nc);
  while (P.corners.length < nc) P.corners.push(M.defCorner());
  P.corners.forEach(c => { ['a', 'b', 'aw', 'bw'].forEach(k => { c[k] = M.num(c[k]); }); });
  P.hw = deepAssign(M.DEF_HW, P.hw); M.HW_NUM.forEach(k => { const v = P.hw[k]; P.hw[k] = (v === '' || v == null || !isFinite(M.num(v))) ? M.DEF_HW[k] : M.num(v); }); ['slideLen', 'clear', 'sideH'].forEach(k => { P.hw[k] = M.num(P.hw[k]); }); if (!M.SLIDE_TYPES[P.hw.slide]) P.hw.slide = 'ball'; if (!['full', 'half', 'inset'].includes(P.hw.hinge)) P.hw.hinge = 'full';
  P.notes = String(P.notes || '');
  P.stock = (Array.isArray(P.stock) ? P.stock : []).map(x => ({ mat: ['b', 'd', 'k'].includes(x && x.mat) ? x.mat : 'b', L: M.num(x && x.L), W: M.num(x && x.W), q: Math.max(0, Math.round(M.num(x && x.q)) || 0) }));
  P.photos = (Array.isArray(P.photos) ? P.photos : []).filter(x => x && x.id).map(x => ({ id: String(x.id), note: String(x.note || ''), ts: x.ts || Date.now() }));
  P.brand = deepAssign({ slide: '', hinge: '' }, P.brand);
  P.quote = deepAssign(B.quote, P.quote); P.quote.valid = M.num(P.quote.valid); P.quote.downPct = Math.min(100, M.num(P.quote.downPct)); P.quote.inst = Math.max(0, Math.round(M.num(P.quote.inst)));
  P.price.extras.forEach(e => { if (e.price == null) { e.price = M.num(e.amount); e.qty = 1; } e.qty = M.num(e.qty == null ? 1 : e.qty); e.price = M.num(e.price); e.name = String(e.name || ''); });
  return P;
}
function migrateV1() {
  const raw = LS.get('kp1'); if (!raw) return null;
  try {
    const o = JSON.parse(raw); const P = M.newProject(S.lang === 'tr' ? 'Eski proje' : 'مشروع قديم');
    const d = P.dims;
    ['legH', 'baseH', 'counterT', 'baseD', 't', 'backT', 'sheetL', 'sheetW', 'kerf'].forEach(k => { if (o[k] != null) d[k] = M.num(o[k]); });
    if (o.wallTotalH) d.totalH = M.num(o.wallTotalH); if (o.wallH) d.upperH = M.num(o.wallH);
    if (o.wallBottom) d.upperBottom = M.num(o.wallBottom); if (o.wallD) d.upperD = M.num(o.wallD);
    P.walls[0].len = M.num(o.wallLen) || 300;
    P.walls[0].base = (o.base || []).map(m => ({ w: M.num(m.w), type: m.type === 'drawer' ? 'drawer' : 'door', n: Math.max(1, M.num(m.n)), label: '' }));
    P.walls[0].upper = (o.wall || []).map(m => ({ w: M.num(m.w), type: 'door', n: Math.max(1, M.num(m.n)), label: '' }));
    return norm(P);
  } catch (e) { return null; }
}
function load() {
  S = { lang: 'ar', splash: true, shop: { name: 'مصطفى نجار', phone: '', logo: '' }, prices: Object.assign({}, M.DEF_PRICES),
    cutMode: 'self', book: [], templates: [], brands: [], lastBackup: 0, firstUse: 0 };
  try { const r = LS.get('kp2.settings'); if (r) { const o = JSON.parse(r); S = deepAssign(S, o); ['book', 'templates', 'brands'].forEach(k => { S[k] = Array.isArray(o[k]) ? o[k] : []; }); } } catch (e) { /* ignore */ }
  if (!S.firstUse) S.firstUse = Date.now();
  S.cutMode = S.cutMode === 'factory' ? 'factory' : 'self';
  S.book = S.book.filter(x => x && typeof x === 'object').map(x => ({ name: String(x.name || ''), price: M.num(x.price) }));
  S.brands = S.brands.filter(x => x && x.id).map(x => ({ id: String(x.id), name: String(x.name || ''), type: x.type === 'hinge' ? 'hinge' : 'slide', note: String(x.note || ''), photo: x.photo || '', hw: x.hw && typeof x.hw === 'object' ? x.hw : null }));
  S.templates = S.templates.filter(x => x && x.p && x.id).map(x => ({ id: String(x.id), name: String(x.name || ''), p: x.p }));
  S.prices = Object.assign({}, M.DEF_PRICES, S.prices);
  DB = { order: [], projects: {}, cur: null };
  try { const r = LS.get('kp2.db'); if (r) { const o = JSON.parse(r); if (o && o.projects) DB = o; } } catch (e) { /* ignore */ }
  Object.keys(DB.projects).forEach(id => norm(DB.projects[id]));
  DB.order = DB.order.filter(id => DB.projects[id]);
  Object.keys(DB.projects).forEach(id => { if (!DB.order.includes(id)) DB.order.push(id); });
  if (!DB.order.length) {
    const P = migrateV1() || M.newProject(''); DB.projects[P.id] = P; DB.order.push(P.id); DB.cur = P.id;
  }
  if (!DB.projects[DB.cur]) DB.cur = DB.order[0];
}
function save() {
  const a = LS.set('kp2.db', JSON.stringify(DB)), b = LS.set('kp2.settings', JSON.stringify(S));
  if ((!a || !b) && !storageWarned) { storageWarned = true; toast(tt('msg.noStorage')); }
}
const cur = () => DB.projects[DB.cur];
let calcCache = null;
function calc(P) {
  const key = JSON.stringify([P, S.prices, S.lang]);
  if (calcCache && calcCache.key === key) return calcCache.res;
  const pref = { base: tt('code.base'), upper: tt('code.upper'), corner: tt('code.corner'), tall: tt('code.tall') };
  const res = M.compute(P, S.prices, pref); calcCache = { key, res }; return res;
}

/* ---------------- photo storage (IndexedDB keeps the app's JSON small) ---------------- */
const IDB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    try { const r = indexedDB.open('kp2files', 1); r.onupgradeneeded = () => r.result.createObjectStore('f'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); }
  }));
  const tx = (mode, fn) => open().then(db => new Promise((res, rej) => { const t = db.transaction('f', mode); const rq = fn(t.objectStore('f')); t.oncomplete = () => res(rq && rq.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }));
  return { put: (k, b) => tx('readwrite', st => st.put(b, k)), get: k => tx('readonly', st => st.get(k)), del: k => tx('readwrite', st => st.delete(k)) };
})();
const phUrl = {};
function imgToBlob(file, maxSide, q) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const sc = Math.min(1, maxSide / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      c.toBlob(b => (b ? res(b) : rej(new Error('blob'))), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('img')); }; img.src = u;
  });
}
async function hydratePhotos() {
  const imgs = Array.from(document.querySelectorAll('img[data-ph]'));
  for (const im of imgs) {
    const id = im.dataset.ph; if (!id) continue;
    if (phUrl[id]) { im.src = phUrl[id]; continue; }
    try { const b = await IDB.get(id); if (b) { phUrl[id] = URL.createObjectURL(b); im.src = phUrl[id]; } } catch (e) { /* ignore */ }
  }
}
function dropPhoto(id) { if (!id) return; try { IDB.del(id).catch(() => {}); } catch (e) { /* ignore */ } if (phUrl[id]) { try { URL.revokeObjectURL(phUrl[id]); } catch (e) { /* ignore */ } delete phUrl[id]; } }

/* ---------------- backup reminder ---------------- */
function backupInfo() {
  const now = Date.now(), last = S.lastBackup || 0;
  const upd = Math.max(0, ...Object.values(DB.projects).map(p => p.updated || 0));
  const named = Object.values(DB.projects).some(p => p.name || (p.photos && p.photos.length));
  const days = Math.floor((now - (last || S.firstUse || now)) / 864e5);
  return { last, days, nag: named && upd > last && days >= 7 };

const brandOf = (P, kind) => { const b = S.brands.find(x => x.id === (P.brand && P.brand[kind])); return b ? b.name : ''; };
const ebTxt = p => {
  if (!p.eb) return '—'; const e = p.ebs; if (!e) return fmt(M.r1(p.eb)) + ' cm';
  const a = []; if (e.l) a.push(e.l + tt('eb.l')); if (e.w) a.push(e.w + tt('eb.w')); return a.join('+') || '—';
};
function facGroups(res) {
  const out = {};
  MATS.forEach(m => {
    const mp = {};
    res.parts.filter(p => p.mat === m).forEach(p => {
      const k = [p.w, p.h, p.grain ? 1 : 0, p.ebs ? p.ebs.l + '/' + p.ebs.w : 'x' + p.eb].join('|');
      if (!mp[k]) mp[k] = { w: p.w, h: p.h, grain: p.grain, p, q: 0, codes: [] };
      mp[k].q += p.q; if (!mp[k].codes.includes(p.code)) mp[k].codes.push(p.code);
    });

}

const HOOK = {
  typeChange(el) {
    const ref = resolve(el.dataset.item + '.type'); const it = ref.o; if (!it) return;
    if (it.type === 'drawer' && it.n < 2) it.n = 3;
    else if (it.type === 'door' || it.type === 'sink') it.n = it.n > 2 ? 1 : Math.max(1, it.n);
    else if (it.type === 'tall') it.n = 2;
    else if (it.type === 'gap' && !it.label) it.label = 'space';
  },
  labelChange(el, v) {
    const ref = resolve(el.dataset.item + '.label'); if (!ref || !ref.o) return; const it = ref.o;
    if (PRESET[v] && !PRESET[v].includes(M.num(it.w))) { if (M.num(it.w) === 60 || M.num(it.w) === 0) it.w = PRESET[v][v === 'fridge' ? 1 : 0]; }
    else if (v === 'fridge' && M.num(it.w) === 60) it.w = 70;
  },
  brandApply(el, v) {
    const k = el.dataset.b.split('.').pop(); const b = S.brands.find(x => x.id === v); if (!b || !b.hw) return;
    if (window.confirm(tt('br.apply', { n: b.name }))) { Object.assign(cur().hw, b.hw); toast(tt('br.applied')); }
  }
};
function onChange(e) {
  const el = e.target; const b = el.dataset && el.dataset.b; if (!b) return;
  let v = el.dataset.t === 'b' ? el.checked : el.dataset.t === 'n' ? Math.max(0, M.num(el.value)) : el.value;
  if (el.dataset.t === 'n' && /\.(n|discount)$/.test(b)) v = b.endsWith('.n') ? Math.max(1, Math.round(v)) : Math.min(100, v);
  const ref = resolve(b); if (!ref) return;
  if (el.type === 'select-one' && /paintFaces$/.test(b)) v = M.num(v);
  ref.o[ref.k] = v;
  if (b.startsWith('P.')) cur().updated = Date.now();
  const hk = el.dataset.after; if (hk && HOOK[hk]) HOOK[hk](el, v);
  save(); render();
}

function getFile(blob, name, type) { return new File([blob], name, { type }); }
async function shareFile(blob, name, type) {
  try {
    const f = getFile(blob, name, type);
    if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: name }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const u = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(u); a.remove(); }, 5000);
}
function svgToPng(svg, w, h) {
  return new Promise((res, rej) => {
    const scale = Math.min(2, Math.sqrt(12e6 / (w * h)));
    const img = new Image(); const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml;charset=utf-8' }));
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = Math.round(w * scale); c.height = Math.round(h * scale);
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); c.toBlob(b => (b ? res(b) : rej(new Error('toBlob'))), 'image/png');
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}
function cutText(P, res) {
  const lines = [`${P.name || tt('proj.noName')} — ${dateStr()}`, `${tt('layout.' + P.layout)}`, ''];
  ['b', 'd', 'k'].forEach(m => {
    const parts = res.parts.filter(p => p.mat === m); if (!parts.length) return;
    lines.push(`== ${groupTitle(m, P)} · ${res.pack[m].buy} ${tt('cut.sheets')} ==`);
    parts.forEach(p => lines.push(`${p.code} ${tt('part.' + p.key)}${p.grain ? ' ⇕' : ''}: ${p.w} × ${p.h}  ×${p.q}  [${ebTxt(p)}]`));
    lines.push('');
  });
  lines.push(`== ${tt('hw.title')} ==`);
  ['hinge', 'slide', 'handle', 'leg', 'hanger', 'pin'].forEach(k => { if (res.hw[k] > 0) lines.push(`${tt('h.' + k)}: ${res.hw[k]}`); });
  lines.push(tt('hw.summary', { slide: `${tt('hw.slide.' + P.hw.slide)} ${M.slideInfo(P, P.dims.baseD).len} cm`, hinge: tt('hw.hinge.' + P.hw.hinge) }));
  res.drill.hinges.forEach(x => lines.push(tt('drill.hingeRow', { h: x.h, n: x.n, pos: x.pos.join(' / ') })));
  res.drill.drawers.forEach(x => { lines.push(tt('drill.drawerInfo', { code: x.code, n: x.n, type: tt('hw.slide.' + x.type), len: x.len, clear: x.clear, boxW: x.boxW, sideH: x.sideH })); x.rows.forEach(r => lines.push(`  #${r.i}: ${tt('drill.slideY')} ${r.slideY}`)); });
  if (res.edgeM > 0) lines.push(`${tt('cut.edge')}: ${fmt(res.edgeM)} m`);
  if (res.paintM2 > 0) lines.push(`${tt('cut.paint')}: ${fmt(res.paintM2)} m²`);
  const bs = brandOf(P, 'slide'), bh = brandOf(P, 'hinge'); if (bs) lines.push(`${tt('br.slide')}: ${bs}`); if (bh) lines.push(`${tt('br.hinge')}: ${bh}`);
  return lines.join('\n');
}

function importData(text) {

  const arr = o && Array.isArray(o.projects) ? o.projects : (o && o.walls ? [o] : null);
  if (!arr || !arr.length) { toast(tt('msg.badFile')); return; }
  let n = 0;
  if (o.settings && typeof o.settings === 'object') {
    (o.settings.book || []).forEach(x => { if (x && x.name && !S.book.some(y => y.name === x.name)) S.book.push({ name: String(x.name), price: M.num(x.price) }); });
    (o.settings.templates || []).forEach(x => { if (x && x.id && x.p && !S.templates.some(y => y.id === x.id)) S.templates.push({ id: String(x.id), name: String(x.name || ''), p: x.p }); });
    (o.settings.brands || []).forEach(x => { if (x && x.id && !S.brands.some(y => y.id === x.id)) S.brands.push({ id: String(x.id), name: String(x.name || ''), type: x.type === 'hinge' ? 'hinge' : 'slide', note: String(x.note || ''), photo: '', hw: x.hw && typeof x.hw === 'object' ? x.hw : null }); });
  }

}
function readLogo(file) {
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const m = 256; const sc = Math.min(1, m / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      S.shop.logo = c.toDataURL('image/png'); save(); render();
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

  priceMode(d) { cur().price.mode = d.v; save(); render(); },
  addExtra() { cur().price.extras.push({ name: '', qty: 1, price: 0 }); save(); render(); },
  delExtra(d) { cur().price.extras.splice(+d.i, 1); save(); render(); },
  toggleCost() { ui.costOpen = !ui.costOpen; render(); },
  print() { window.print(); },
  async shareImg() {
    const P = cur(); const res = calc(P);
    try {
      let img3d = ''; try { img3d = V3.snapshot(P, ui.v3, 1200, 900).toDataURL('image/png'); } catch (e) { /* skip */ }
      const o = D.sheetOfImages(P, { img3d, t: tfun, shop: Object.assign({}, S.shop, { logo: S.shop.logo || DEFAULT_LOGO }), date: dateStr(), priceText: (P.price.showPrice && res.quote.total > 0) ? `${tt('q.total')}: ${moneyTxt(res.quote.total)}` : '', termLines: (P.price.showPrice && res.quote.total > 0) ? termLines(P, res) : [] });
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${o.w}" height="${o.h}" viewBox="0 0 ${o.w} ${o.h}" font-family='${D.FONT}'>${o.body}</svg>`;
      const blob = await svgToPng(svg, o.w, o.h);
      await shareFile(blob, `kitchen-${Date.now()}.png`, 'image/png');
    } catch (e) { toast(tt('msg.shareFail')); }
  },
  async shareText() {
    const P = cur(); const text = cutText(P, calc(P));
    try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(text); toast(tt('msg.copied')); } catch (e) { window.prompt('', text); }
  },
  cutMode(d) { S.cutMode = d.v === 'factory' ? 'factory' : 'self'; save(); render(); },
  addStock() { const P = cur(); P.stock.push({ mat: 'b', L: P.dims.sheetL, W: P.dims.sheetW, q: 1 }); P.updated = Date.now(); save(); render(); },
  delStock(d) { cur().stock.splice(+d.i, 1); save(); render(); },
  async cutCSV() { const P = cur(); await shareFile(new Blob([cutCSV(P, calc(P))], { type: 'text/csv' }), `cutlist-${Date.now()}.csv`, 'text/csv'); },
  async orderCSV() { const P = cur(); await shareFile(new Blob([orderCSV(P, calc(P))], { type: 'text/csv' }), `order-${Date.now()}.csv`, 'text/csv'); },
  shareFac() { shareTextOut(facText(cur(), calc(cur()))); },
  shareOrder() { shareTextOut(orderText(cur(), calc(cur()))); },
  shareCounter() { shareTextOut(counterText(cur())); },
  toggleLabels() { ui.lblOpen = !ui.lblOpen; render(); },
  printLabels() {
    document.body.classList.add('plabels');
    const done = () => { document.body.classList.remove('plabels'); window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done); setTimeout(() => window.print(), 50); setTimeout(done, 60000);
  },
  saveTpl(d) {
    const P = DB.projects[d.id]; const n = window.prompt(tt('tpl.askName'), P.name); if (n === null) return;
    const c = JSON.parse(JSON.stringify(P)); c.photos = []; c.stock = []; c.notes = ''; c.name = ''; delete c.id;
    S.templates.push({ id: M.uid(), name: n.trim(), p: c }); save(); render(); toast(tt('tpl.saved'));
  },
  useTpl(d) {
    const t = S.templates.find(x => x.id === d.id); if (!t) return;
    const n = window.prompt(tt('proj.askName'), ''); if (n === null) return;
    const P = norm(JSON.parse(JSON.stringify(t.p))); P.id = M.uid(); P.name = n.trim(); P.photos = []; P.stock = []; P.created = P.updated = Date.now();
    DB.projects[P.id] = P; DB.order.unshift(P.id); DB.cur = P.id; ui.wall = 0; save(); ui.tab = 'walls'; fullRender(); window.scrollTo(0, 0);
  },
  delTpl(d) { if (!window.confirm(tt('tpl.confirmDel'))) return; S.templates = S.templates.filter(x => x.id !== d.id); save(); render(); },
  addBook() { S.book.push({ name: '', price: 0 }); save(); render(); },
  delBook(d) { S.book.splice(+d.i, 1); save(); render(); },
  bookToQuote(d) { const b = S.book[+d.i]; if (!b) return; cur().price.extras.push({ name: b.name, qty: 1, price: b.price }); cur().updated = Date.now(); save(); render(); },
  upShort(d) { const ref = resolve(d.p + '.h'); if (!ref || !ref.o) return; const it = ref.o, tot = cur().dims.totalH; it.h = 40; it.bot = M.r1(tot - 40); cur().updated = Date.now(); save(); render(); },
  upReset(d) { const ref = resolve(d.p + '.h'); if (!ref || !ref.o) return; ref.o.h = 0; ref.o.bot = 0; cur().updated = Date.now(); save(); render(); },
  setW(d) { const ref = resolve(d.p + '.w'); if (!ref || !ref.o) return; ref.o[ref.k] = +d.w; cur().updated = Date.now(); save(); render(); },
  newBrand(d) {
    const n = window.prompt(tt('br.askName'), ''); if (n === null || !n.trim()) return;
    const b = { id: M.uid(), name: n.trim(), type: d.type === 'hinge' ? 'hinge' : 'slide', note: '', photo: '', hw: null };
    S.brands.push(b); if (ui.tab === 'specs') cur().brand[b.type] = b.id; save(); render();
  },
  brandSnap(d) {
    const b = S.brands.find(x => x.id === d.id); if (!b) return; const P = cur();
    const keys = b.type === 'hinge' ? ['hinge', 'hing2', 'hing3', 'hing4', 'hingeEnd', 'hingeEndShort', 'hingeShortBelow', 'cupD', 'cupDepth', 'cupEdge', 'plateSet'] : ['slide', 'slideLen', 'clear', 'sideH', 'dboxGroove', 'boxOff'];
    b.hw = {}; keys.forEach(k => { b.hw[k] = P.hw[k]; }); save(); toast(tt('br.snapped'));
  },
  brandPhoto(d) { ui.phTarget = { kind: 'brand', id: d.id }; const f = $('#phFile'); if (f) f.click(); },
  delBrand(d) {
    if (!window.confirm(tt('br.confirmDel'))) return; const b = S.brands.find(x => x.id === d.id); if (b && b.photo) dropPhoto(b.photo);
    S.brands = S.brands.filter(x => x.id !== d.id); Object.values(DB.projects).forEach(P => { ['slide', 'hinge'].forEach(k => { if (P.brand[k] === d.id) P.brand[k] = ''; }); }); save(); render();
  },
  addPhoto() { ui.phTarget = { kind: 'site' }; const f = $('#phFile'); if (f) f.click(); },
  delPhoto(d) { if (!window.confirm(tt('ph.confirmDel'))) return; const P = cur(); const x = P.photos[+d.i]; if (x) dropPhoto(x.id); P.photos.splice(+d.i, 1); P.updated = Date.now(); save(); render(); },
  viewPhoto(d) {
    const u = phUrl[d.id]; if (!u) return; const o = document.createElement('div'); o.className = 'phview'; o.innerHTML = `<img src="${u}" alt="">`;
    o.addEventListener('click', () => o.remove()); document.body.appendChild(o);
  },
  logoPick() { const f = $('#logoFile'); if (f) f.click(); },
  logoDel() { S.shop.logo = ''; save(); render(); }
};

function showSplash() {
  if (S.splash === false || document.getElementById('splash')) return;
  const star = `<svg viewBox="-50 -50 100 100" class="sp-star" aria-hidden="true"><g fill="none" stroke="#e9c46a" stroke-width="1.6"><rect x="-24" y="-24" width="48" height="48"/><rect x="-24" y="-24" width="48" height="48" transform="rotate(45)"/><circle r="30"/><circle r="9" fill="#e9c46a"/></g><g fill="#e9c46a">${[0, 45, 90, 135, 180, 225, 270, 315].map(a => `<circle cx="0" cy="-42" r="2.4" transform="rotate(${a})"/>`).join('')}</g></svg>`;
  const corner = `<svg viewBox="0 0 60 60" class="sp-corner" aria-hidden="true"><g fill="none" stroke="#e9c46a" stroke-width="1.6" stroke-linecap="round"><path d="M4 56 V14 Q4 4 14 4 H56"/><path d="M12 56 V22 Q12 12 22 12 H56" opacity=".55"/><circle cx="14" cy="14" r="3" fill="#e9c46a" stroke="none"/><path d="M22 22 l6 6 m0 -6 l-6 6" opacity=".7"/></g></svg>`;
  const div = `<div class="sp-div"><i></i><svg viewBox="-10 -10 20 20" width="18" height="18"><rect x="-5" y="-5" width="10" height="10" transform="rotate(45)" fill="#e9c46a"/></svg><i></i></div>`;
  const el = document.createElement('div'); el.id = 'splash'; el.setAttribute('role', 'dialog');
  el.innerHTML = `<div class="sp-frame"><div class="sp-c tl">${corner}</div><div class="sp-c tr">${corner}</div><div class="sp-c bl">${corner}</div><div class="sp-c br">${corner}</div>
    <div class="sp-in">${star}<div class="sp-gift">${esc(tt('splash.gift'))}</div><div class="sp-lbl">${esc(tt('splash.from'))}</div>
    <div class="sp-name">${esc(tt('splash.name1'))}</div><div class="sp-sub">( ${esc(tt('splash.sub1'))} )</div>${div}
    <div class="sp-lbl">${esc(tt('splash.to'))}</div><div class="sp-name big">${esc(tt('splash.name2'))}</div>
    <div class="sp-app">${esc(tt('app.title'))}</div><div class="sp-hint">${esc(tt('splash.enter'))}</div></div></div>`;
  document.body.appendChild(el);
  let gone = false;
    // stage 2: the shop logo fades in over the gift screen, then the app opens
  let t1 = 0;
  const stage2 = () => {
    if (gone) return; gone = true; clearTimeout(t1);
    const l = document.createElement('div'); l.id = 'splash2'; l.setAttribute('role', 'dialog');
    l.innerHTML = `<img class="sp-logo" alt="" src="${SPLASH_LOGO}"><div class="sp-hint2">${esc(tt('splash.enter'))}</div>`;
    document.body.appendChild(l);
    setTimeout(() => el.remove(), 800);
    let g2 = false, armed = false;
    const end = () => { if (g2) return; g2 = true; l.classList.add('out'); setTimeout(() => l.remove(), 500); };
    setTimeout(() => { armed = true; }, 900); // ignore the tail of the tap that opened this screen
    l.addEventListener('click', () => { if (armed) end(); });
    setTimeout(end, 4500);
  };
  el.addEventListener('click', stage2); el.addEventListener('touchend', stage2, { passive: true });
  t1 = setTimeout(stage2, 5500);
}

function boot() {
  load();
  document.addEventListener('change', e => {
    const t = e.target;
    if (t && t.id === 'importFile' && t.files && t.files[0]) { const r = new FileReader(); r.onload = () => importData(String(r.result)); r.readAsText(t.files[0]); t.value = ''; return; }
    if (t && t.id === 'logoFile' && t.files && t.files[0]) { readLogo(t.files[0]); t.value = ''; return; }
    if (t && t.id === 'phFile' && t.files && t.files[0]) { handlePhoto(t.files[0]); t.value = ''; return; }
    onChange(e);
  });
  document.addEventListener('pointerdown', onPointerDown, true);
  document.addEventListener('click', onClick);
  $('#langBtn').addEventListener('click', () => { S.lang = S.lang === 'ar' ? 'tr' : 'ar'; save(); fullRender(); });
  $('#ver').textContent = 'v' + VERSION;
  fullRender();
  showSplash();
  try { const bi = backupInfo(); if (bi.nag) { const b = $('#banner'); b.hidden = false; b.dataset.nag = '1'; b.innerHTML = `${esc(bi.last ? tt('bk.nag', { d: bi.days }) : tt('bk.nagNever'))} <button class="p" id="nagBtn">${esc(tt('bk.do'))}</button>`; $('#nagBtn').onclick = () => ACT.exportAll(); } } catch (e) { /* ignore */ }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* ignore */ }
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
    navigator.serviceWorker.addEventListener('message', ev => {
      if (ev.data === 'updated') { const b = $('#banner'); b.hidden = false; b.innerHTML = `${esc(tt('upd.ready'))} <button class="p" id="reloadBtn">${esc(tt('upd.reload'))}</button>`; $('#reloadBtn').onclick = () => location.reload(); }
    });
  }
}
window.__app = { get DB() { return DB; }, get S() { return S; }, ui, ACT, R, fullRender, render, tt, calc, cur };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body>
</html>
