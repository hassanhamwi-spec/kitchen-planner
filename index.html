<title>Mustafa Najar · Mutfak Tasarımcısı</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#222;--mut:#777;--acc:#b5651d;--acc2:#8f4e14;--line:#ddd;--ok:#2a7d2a;--bad:#c00;--warn:#b86e00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(46px + env(safe-area-inset-bottom));font-size:15px;line-height:1.35}
header{background:var(--acc);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:0;z-index:6}
header .hbrand{display:flex;align-items:center;gap:10px;min-width:0}
header #hdrLogo{width:38px;height:38px;border-radius:9px;flex:none;object-fit:cover;box-shadow:0 0 0 1.5px #e9c46a}
header #hdrTitle{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:#fff;color:var(--acc);border:0;border-radius:8px;padding:6px 12px;font-weight:700;font-size:15px;flex:none}
nav{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:calc(52px + env(safe-area-inset-top));z-index:5;-webkit-overflow-scrolling:touch}
nav button{white-space:nowrap;border:1px solid var(--line);background:#fafafa;border-radius:20px;padding:8px 13px;font-size:14px;flex:none;color:var(--ink)}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{padding:12px;max-width:760px;margin:0 auto}
#banner{background:#fff3d6;padding:8px 12px;text-align:center;font-size:14px}
#banner button{margin-inline-start:8px;padding:6px 12px}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
.card.info{background:#fff8ea;border:1px solid #f0d9ac}
.card.sel{border:2px solid var(--acc)}
h2{font-size:16px;margin:0 0 10px}
.mut{color:var(--mut);font-size:13px}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}.warn{color:var(--warn);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.f{min-width:0}.f.full{grid-column:1/-1;margin-bottom:8px}
label{font-size:12.5px;color:var(--mut);display:block;margin-bottom:2px}
input[type=text],select,textarea{width:100%;font-size:16px;padding:9px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-family:inherit;min-height:42px}
textarea{resize:vertical}
input[type=color]{width:100%;height:42px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff}
.chk{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink);margin:6px 0}
.chk input{width:22px;height:22px}
button{font-family:inherit;cursor:pointer}
button.p{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:700;min-height:44px}
button.s{background:#eee;color:var(--ink);border:0;border-radius:10px;padding:10px 12px;font-size:15px;min-height:44px}
button.d{background:#fde8e8;color:#b00;border:0;border-radius:10px;padding:10px 12px;font-size:16px;min-height:44px}
button.sm{padding:6px 12px;min-height:36px;font-size:15px}
button.wide{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:#fafafa;border-radius:10px;padding:10px 6px;font-size:14px;min-height:44px;color:var(--ink)}
.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
.wallseg{margin-bottom:12px;overflow-x:auto}
.it{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px;background:#fcfbf8}
.r1{display:grid;grid-template-columns:24px 1fr 1.35fr 1fr;gap:6px;align-items:end}
.r1.c3{grid-template-columns:1fr 1fr 1fr;margin-bottom:6px}
.r1.c4{grid-template-columns:1fr 1fr;margin-top:6px}
.idx{font-weight:700;color:var(--acc);align-self:center;text-align:center}
.r2{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.acts{display:flex;align-items:flex-end;justify-content:flex-end}
.sum{font-size:14px;margin:8px 0}
.svgbox{margin:8px 0;border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden}
.svgbox.sheetbox{margin:8px 0}
details summary{cursor:pointer;font-weight:700;padding:4px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:center}
th{background:#f0ebe0;font-size:12px}
td:first-child,th:first-child{text-align:start}
.ct td:nth-child(2),.ct th:nth-child(2){text-align:start}
table.qt td:last-child{text-align:end;white-space:nowrap}
table.qt th:last-child{text-align:end}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.clr span{font-size:12.5px;color:var(--mut);display:block;margin-bottom:2px}
.logo img{max-height:70px;max-width:160px;margin:8px 0;display:block}
.page{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
.phead{display:flex;align-items:center;gap:12px;background:var(--acc);color:#fff;border-radius:10px;padding:12px;margin-bottom:12px}
.phead img{height:56px;width:56px;object-fit:contain;background:#fff;border-radius:8px;padding:2px}
.phead .shop{font-size:20px;font-weight:700}.phead .phone{opacity:.9}
.pcust{text-align:center;margin-bottom:8px;font-size:18px}
.swatches{display:flex;justify-content:center;gap:18px;margin:12px 0;flex-wrap:wrap}
.swatches div{text-align:center;font-size:13px}
.swatches i{display:block;width:44px;height:44px;border-radius:10px;border:1px solid #666;margin:0 auto 4px}
.pprice{margin-top:10px}.pnotes{margin-top:10px;padding:10px;background:#faf7f0;border-radius:8px;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:10px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90%;text-align:center;font-size:14px}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#ver{text-align:center;color:var(--mut);font-size:12px;margin-top:6px}
@media print{
  header,nav,.noprint,#banner,#ver,#toast{display:none!important}
  body{background:#fff;padding:0}
  main{padding:0;max-width:none}
  .card,.page{box-shadow:none;break-inside:avoid}
  .svgbox{break-inside:avoid}
  @page{margin:10mm}
}

tr.zero td{color:var(--warn)}
.code{unicode-bidi:isolate}
.curbox{margin-top:10px}.curbox .seg{margin:4px 0}
.v3box{margin:8px 0;border:1px solid var(--line);border-radius:8px;background:#f4f1ea;overflow:hidden}.v3box canvas{width:100%;aspect-ratio:4/3;display:block;touch-action:none;cursor:grab}.v3bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px;background:#fff;flex-wrap:wrap}
h3{font-size:14px;margin:12px 0 4px;color:var(--acc2)}

#splash{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 30%,#8f4e14 0,#5a2f0c 55%,#2e1706 100%);color:#fbeed1;animation:spIn .7s ease both;cursor:pointer}
#splash.out{opacity:0;transition:opacity .45s}
@keyframes spIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.sp-frame{position:relative;width:100%;max-width:420px;min-height:min(560px,88vh);border:2px solid #e9c46a;border-radius:18px;outline:1px solid rgba(233,196,106,.5);outline-offset:6px;display:flex;align-items:center;justify-content:center;padding:34px 22px;background:rgba(255,255,255,.03)}
.sp-c{position:absolute;width:44px;height:44px}.sp-c svg{width:100%;height:100%;display:block}
.sp-c.tl{top:6px;left:6px}.sp-c.tr{top:6px;right:6px;transform:scaleX(-1)}.sp-c.bl{bottom:6px;left:6px;transform:scaleY(-1)}.sp-c.br{bottom:6px;right:6px;transform:scale(-1,-1)}
.sp-in{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;animation:spUp 1s .25s ease both}
@keyframes spUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sp-star{width:92px;height:92px;margin-bottom:6px;animation:spRot 24s linear infinite}
@keyframes spRot{to{transform:rotate(360deg)}}
.sp-gift{font-family:"DecoType Naskh","Geeza Pro","Damascus","Noto Naskh Arabic","Amiri",Georgia,serif;font-size:44px;font-weight:700;color:#e9c46a;line-height:1.1;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.sp-lbl{font-size:16px;opacity:.8;margin-top:8px}
.sp-name{font-family:"DecoType Naskh","Geeza Pro","Damascus","Noto Naskh Arabic","Amiri",Georgia,serif;font-size:34px;font-weight:700;line-height:1.25;color:#fff7e3}
.sp-name.big{font-size:38px;color:#ffe08a}
.sp-sub{font-size:20px;color:#e9c46a;margin-top:-2px}
.sp-div{display:flex;align-items:center;gap:10px;width:70%;margin:10px 0 2px}.sp-div i{flex:1;height:1px;background:linear-gradient(90deg,transparent,#e9c46a,transparent)}
.sp-app{margin-top:18px;font-size:15px;letter-spacing:.4px;opacity:.75;border-top:1px solid rgba(233,196,106,.4);padding-top:10px}
.sp-hint{margin-top:10px;font-size:13px;opacity:.6;animation:spBlink 2s ease-in-out infinite}
@keyframes spBlink{50%{opacity:.25}}
#splash2{position:fixed;inset:0;z-index:101;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;cursor:pointer;animation:spIn .7s ease both}
#splash2.out{opacity:0;transition:opacity .5s}
.sp-logo{width:min(94vw,86vh,620px);height:auto;display:block;animation:spLogo 1.1s .1s ease both}
.sp-hint2{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom));font-size:13px;color:#e9c46a;opacity:.55;animation:spBlink 2s ease-in-out infinite}
@keyframes spLogo{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@media print{#splash,#splash2{display:none!important}}

/* ---- v2.6 ---- */
.r1.q4{grid-template-columns:1fr 1fr 1fr 1fr;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chips button{min-height:36px;padding:4px 12px;border:1px solid var(--line);background:#fafafa;border-radius:18px;color:var(--ink)}
.chips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.bth{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#eee;cursor:pointer}
.phi{display:flex;gap:8px;align-items:center}.phi .f{flex:1}
.phview{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:10px}.phview img{max-width:100%;max-height:100%;object-fit:contain}
.seq{font-size:13px;margin:4px 0 12px;line-height:1.7}.seq b{display:block;color:var(--acc2)}
td.cds{font-size:12px;color:var(--mut);word-break:break-all}
.pterms{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;font-size:13px;line-height:1.7}
details.card>summary{font-weight:700;cursor:pointer;padding:4px 0}
#banner button.p{margin-inline-start:8px}
.lblgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}
.lbl{border:1px dashed #777;border-radius:6px;padding:5px 7px;background:#fff;break-inside:avoid;font-size:12px}
.lbl .lt{display:flex;justify-content:space-between;gap:6px;align-items:baseline}.lbl .lt b{font-size:14px}
.lbl .ls{font-size:16px;font-weight:700;margin:2px 0}
.lbl .lm{display:flex;gap:6px;align-items:center}.lbl .lm svg{width:64px;height:auto;flex:none}
.lbl .le{font-weight:700}.lbl .lg{color:var(--mut);font-size:11px}
@media print{
  body.plabels main>*:not(.lblcard){display:none!important}
  body.plabels .lblcard{box-shadow:none}
  body.plabels .lblcard h2{display:none}
  body.plabels .lblgrid{grid-template-columns:repeat(3,1fr);gap:4px}
  .pterms{break-inside:avoid}
}

details.upx{margin-top:6px;border-top:1px dashed var(--line);padding-top:4px}details.upx>summary{font-size:13px;color:var(--acc2);cursor:pointer;padding:4px 0}

body.viewer #nav,body.viewer #ver,body.viewer #banner{display:none!important}

</style>
</head>

  t = t || (k => k);
  const W = P.walls[wi], d = P.dims, len = num(W.len), H = d.totalH;
  const maxDrop = Math.max(M.drop(W, 0), M.drop(W, len));
  const pad = 18, vw = len + 2 * pad, vh = H + maxDrop + pad * 2 + 30;
  const fs = Math.max(6.5, vw / 36), fsS = fs * 0.72;
  const X = x => pad + x, Y = y => pad + H - y, YF = x => Y(0) + M.drop(W, x);
  const col = P.finish.colors, doorC = col.door, bodyC = col.body, ctrC = col.counter;
  const hi = M.handleInfo(P), dcol = (it, row) => M.doorColor(P, it, row), upC = col.doorUp || col.door, HHW = w => Math.max(1, Math.min(hi.lenDr / 2, w / 2 - 3));
  const plinthC = shade(bodyC, -0.2), line = shade(doorC, -0.5);
  const id = 'h' + (++uidn);
  const R = (x0, x1, y0, y1, fill, stroke, sw, extra) =>
    `<rect x="${r1(X(x0))}" y="${r1(Y(y1))}" width="${r1(x1 - x0)}" height="${r1(y1 - y0)}" fill="${fill}"${stroke ? ` stroke="${stroke}" stroke-width="${sw || 0.5}"` : ''}${extra || ''}/>`;
  const L_ = (x0, y0, x1, y1, stroke, sw, extra) =>
    `<line x1="${r1(X(x0))}" y1="${r1(y0)}" x2="${r1(X(x1))}" y2="${r1(y1)}" stroke="${stroke}" stroke-width="${sw || 0.5}"${extra || ''}/>`;
  const T = (x, y, txt, size, fill, extra) =>
    `<text x="${r1(X(x))}" y="${r1(y)}" font-size="${r1(size)}" fill="${fill || '#333'}" text-anchor="middle"${extra || ''}>${esc(txt)}</text>`;
  let s = `<defs><pattern id="${id}" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#999" stroke-width="1"/></pattern></defs>`;
  s += `<rect width="${vw}" height="${vh}" fill="#fff"/>`;
  s += `<polygon points="${X(0)},${Y(H)} ${X(len)},${Y(H)} ${X(len)},${r1(YF(len))} ${X(0)},${r1(YF(0))}" fill="#faf7f0" stroke="#bbb" stroke-width=".6"/>`;

  /* obstacles */
  (W.obs || []).forEach(o => {
    const [y0, y1] = M.obsRange(P, o); const x0 = num(o.x), x1 = x0 + num(o.w);
    if (o.type === 'window') {
      s += R(x0, x1, y0, y1, '#cfe6f5', '#5d8fb3', 0.9) + L_((x0 + x1) / 2, Y(y1), (x0 + x1) / 2, Y(y0), '#5d8fb3', 0.6);
    } else if (o.type === 'door') {
      s += R(x0, x1, y0, y1, '#c8a27c', '#8a6a48', 0.9) + `<circle cx="${r1(X(x1 - 6))}" cy="${r1(Y(y1 / 2))}" r="1.8" fill="#6b4f33"/>`;
    } else if (o.type === 'column') {
      s += R(x0, x1, y0, y1, '#d6d6d6', '#888', 0.8) + R(x0, x1, y0, y1, `url(#${id})`, null);
    } else {
      s += R(x0, x1, y0, y1, '#f4a63a', '#b8731a', 0.5, ' rx="1"');
    }
  });

  const yb = d.legH, ytop = d.legH + d.baseH, ub = d.upperBottom, ut = d.upperBottom + d.upperH;
  const base = M.place(P, wi, 'base'), upper = M.place(P, wi, 'upper');
  const pref = { base: t('code.base'), upper: t('code.upper'), corner: t('code.corner'), tall: t('code.tall') };
  const codeAt = {}; M.cabinets(P, pref).forEach(c => { if (c.wall === wi && c.x0 != null) codeAt[c.row + ':' + c.x0] = c.code; });
  const covered = [];
  const n0 = M.arms(P, wi, 'base');

  /* base row */
  const plinth = (x0, x1) => {
    let r = `<polygon points="${r1(X(x0))},${r1(Y(yb))} ${r1(X(x1))},${r1(Y(yb))} ${r1(X(x1))},${r1(YF(x1))} ${r1(X(x0))},${r1(YF(x0))}" fill="${plinthC}" stroke="${line}" stroke-width=".4"/>`;
    if (maxDrop > 0.05) {
      const ln = M.legNeed(P, wi, x0, x1); const cx = (x0 + x1) / 2;
      const yy = (Y(yb) + YF(cx)) / 2 + fsS * 0.35;
      r += T(cx, yy, r1((ln.min + ln.max) / 2), fsS, '#fff', ' font-weight="700"');
    }
    return r;
  };
  const handleV = (x1, top, bottom) => L_(x1 - 4, top, x1 - 4, bottom, hi.color, hi.w, ' stroke-linecap="round"');
  base.placed.forEach(p => {
    const it = p.it, x0 = p.x0, x1 = p.x1, w = x1 - x0, n = Math.max(1, num(it.n));
    if (it.type === 'gap') {
      const lab = it.label || 'space';
      if (['dishwasher', 'oven', 'hob', 'sink', 'space'].includes(lab)) covered.push([x0, x1]);
      if (lab === 'fridge') {
        s += R(x0, x1, 0, 178, '#eef3f6', '#8aa', 0.8, ' stroke-dasharray="3 2"') + T((x0 + x1) / 2, Y(90), t('gap.fridge'), fsS, '#567');
      } else if (['dishwasher', 'oven', 'hob', 'sink'].includes(lab)) {
        s += R(x0, x1, yb, ytop, '#eef3f6', '#8aa', 0.8, ' stroke-dasharray="3 2"') + T((x0 + x1) / 2, Y(ytop / 2 + yb / 2), t('gap.' + lab), fsS, '#567');
      } else if (lab === 'panel') {
        const pn = M.panels(P, wi).find(q => q.it === it); if (pn) s += R(x0, x1, pn.y0, pn.y1, dcol(it, 'base'), line, 0.6);
      }
      return;
    }
    const tall = it.type === 'tall'; const top = tall ? yb + d.tallH : ytop;
    if (!tall) covered.push([x0, x1]);
    s += plinth(x0, x1);
    const dC = dcol(it, 'base'); s += R(x0, x1, yb, top, tall ? shade(dC, -0.04) : dC, line, 0.6);
    if (it.type === 'ovenu') {
      const nh = M.ovenNiche(d, it), hd = M.ovenZone(d, it), fh = hd / n;
      s += R(x0 + 1, x1 - 1, top - nh, top - 0.5, '#c8ced3', line, 0.5) + T((x0 + x1) / 2, Y(top - nh / 2) + fsS * 0.35, t('gap.oven'), fsS, '#567');
      for (let j = 0; j < n; j++) {
        const yy0 = yb + j * fh, yy1 = yb + (j + 1) * fh;
        s += R(x0 + .4, x1 - .4, yy0 + .4, yy1 - .4, 'none', line, 0.4) + L_(x0 + w / 2 - HHW(w), Y(yy1) + 6, x0 + w / 2 + HHW(w), Y(yy1) + 6, hi.color, hi.w, ' stroke-linecap="round"');
      }
    } else if (it.type === 'drawer') {
      const fh = d.baseH / n;
      for (let j = 0; j < n; j++) {
        const yy0 = top - (j + 1) * fh, yy1 = top - j * fh;
        s += R(x0 + .4, x1 - .4, yy0 + .4, yy1 - .4, 'none', line, 0.4) + L_(x0 + w / 2 - HHW(w), Y(yy1) + 6, x0 + w / 2 + HHW(w), Y(yy1) + 6, hi.color, hi.w, ' stroke-linecap="round"');
      }
    } else if (tall) {
      const hl = Math.round(d.tallH * 0.45), ymid = yb + hl;
      s += L_(x0, Y(ymid), x1, Y(ymid), line, 0.5);
      for (let j = 0; j < n; j++) {
        const dx = x0 + j * (w / n); if (j > 0) s += L_(dx, Y(top), dx, Y(yb), line, 0.4);
      }
      const hx = n === 1 ? x1 : x0 + w / n; { const hL = Math.max(3, Math.min(hi.len, hl - 8)); s += handleV(hx, Y(ymid) + 4, Y(ymid) + 4 + hL) + handleV(hx, Y(ymid) - 4 - hL, Y(ymid) - 4); }
    } else {
      for (let j = 0; j < n; j++) {
        const dx = x0 + j * (w / n);
        if (j > 0) s += L_(dx, Y(top), dx, Y(yb), line, 0.4);
        const hx = n === 1 ? x1 : (j % 2 === 0 ? dx + w / n : dx + 8);
        s += handleV(hx, Y(top) + 4, Y(top) + 4 + Math.max(3, Math.min(hi.len, d.baseH - 8)));
      }
    }
    if (w >= 20 && !tall) s += T((x0 + x1) / 2, Y(yb) - 0, '', fsS, '#777');
    if (w >= 20) s += T((x0 + x1) / 2, Y(top) + fsS * 1.9 + (it.type === 'drawer' ? 8 : 0) + (tall ? 0 : 14), codeAt['base:' + x0] || '', fsS * 0.85, '#8a7a60', ' direction="ltr"');
  });
  /* base corners (arms at wall ends) */
  const cornerArm = (x0, x1, row) => {
    const top = row === 'base' ? ytop : ut, bot = row === 'base' ? yb : ub;
    let r = '';
    if (row === 'base') { r += plinth(x0, x1); covered.push([x0, x1]); }
    r += R(x0, x1, bot, top, shade(row === 'base' ? doorC : upC, -0.07), line, 0.6) + R(x0, x1, bot, top, `url(#${id})`, null, 0, ' opacity=".35"');
    r += T((x0 + x1) / 2, Y((top + bot) / 2) + fsS * 0.35, t('corner.short'), fsS * 1.1, '#444', ' font-weight="700"');
    return r;
  };
  if (n0.s > 0) s += cornerArm(0, n0.s, 'base');
  if (n0.e > 0) s += cornerArm(len - n0.e, len, 'base');

  /* counter */
  covered.sort((a, b) => a[0] - b[0]);
  const merged = []; covered.forEach(c => { const l = merged[merged.length - 1]; if (l && c[0] <= l[1] + 0.05) l[1] = Math.max(l[1], c[1]); else merged.push(c.slice()); });
  merged.forEach(c => { s += R(c[0], c[1], ytop, ytop + d.counterT, ctrC, '#222', 0.4); });

  /* upper row */
  upper.placed.forEach(p => {
    const it = p.it, x0 = p.x0, x1 = p.x1, w = x1 - x0, n = Math.max(1, num(it.n));
    const ud = M.upDim(d, it), ub = it.type === 'gap' ? d.upperBottom : ud.b, ut = it.type === 'gap' ? d.upperBottom + d.upperH : ud.b + ud.h;
    if (it.type === 'gap') {
      if (it.label === 'hood') s += R(x0, x1, ub, ut, '#eef3f6', '#8aa', 0.8, ' stroke-dasharray="3 2"') + T((x0 + x1) / 2, Y((ub + ut) / 2), t('gap.hood'), fsS, '#567');
      if (it.label === 'panel') { const pn = M.panels(P, wi).find(q => q.it === it); if (pn) s += R(x0, x1, pn.y0, pn.y1, dcol(it, 'upper'), line, 0.6); }
      return;
    }
    s += R(x0, x1, ub, ut, dcol(it, 'upper'), line, 0.6);
    if (w >= 20) s += T((x0 + x1) / 2, Y(ub) - fsS * 3.2, codeAt['upper:' + x0] || '', fsS * 0.85, '#8a7a60', ' direction="ltr"');
    for (let j = 0; j < n; j++) {
      const dx = x0 + j * (w / n); if (j > 0) s += L_(dx, Y(ut), dx, Y(ub), line, 0.4);
      const hx = n === 1 ? x1 : (j % 2 === 0 ? dx + w / n : dx + 8);
      s += handleV(hx, Y(ub) - 4 - Math.max(3, Math.min(hi.len, ut - ub - 8)), Y(ub) - 4);
    }
  });
  const u0 = M.arms(P, wi, 'upper');
  if (u0.s > 0) s += cornerArm(0, u0.s, 'upper');
  if (u0.e > 0) s += cornerArm(len - u0.e, len, 'upper');

  /* floor line + ceiling */
  s += `<line x1="${X(-6)}" y1="${r1(YF(0))}" x2="${X(len + 6)}" y2="${r1(YF(len))}" stroke="#444" stroke-width="1.4"/>`;

  /* dimension row under the floor */
  const yd = Y(0) + maxDrop + fs + 6;
  const dims = [];
  if (n0.s > 0) dims.push([0, n0.s]);
  base.placed.forEach(p => dims.push([p.x0, p.x1]));
  if (n0.e > 0) dims.push([len - n0.e, len]);
  dims.forEach(c => {
    s += L_(c[0], yd - fs, c[0], yd + 2, '#888', 0.4);
    if (c[1] - c[0] >= 14) s += T((c[0] + c[1]) / 2, yd - 1, r1(c[1] - c[0]), fsS, '#444');
  });
  s += L_(len, yd - fs, len, yd + 2, '#888', 0.4);
  const yt = yd + fs + 4;
  s += L_(0, yt - 3, len, yt - 3, '#444', 0.6) + L_(0, yt - 6, 0, yt, '#444', 0.6) + L_(len, yt - 6, len, yt, '#444', 0.6);
  s += `<rect x="${r1(X(len / 2) - fs * 2.2)}" y="${r1(yt - fs * 0.95)}" width="${r1(fs * 4.4)}" height="${r1(fs * 1.25)}" fill="#fff"/>` + T(len / 2, yt, r1(len), fs, '#111', ' font-weight="700"');
  /* upper widths */
  upper.placed.forEach(p => { if (p.it.type !== 'gap' && p.x1 - p.x0 >= 14) { const u2 = M.upDim(d, p.it); s += T((p.x0 + p.x1) / 2, Y(u2.b + u2.h) - 3, r1(p.x1 - p.x0), fsS, '#444'); } });
  /* wall title */
  s += `<text x="${r1(X(len / 2))}" y="${r1(fs + 2)}" font-size="${r1(fs * 1.1)}" fill="#8a5a1a" text-anchor="middle" font-weight="700">${esc(t('wall.n', { n: wi + 1 }))}</text>`;
  return { w: vw, h: vh, body: s };
}

/* ---------------- plan (top view) ---------------- */
function plan(P, t) {
  t = t || (k => k);
  const d = P.dims, L = P.layout, X0 = 34, Y0 = 34; const len = i => num(P.walls[i].len);
  const TR = wi => { const f = M.frame(P, wi).tr; return (x, dd) => { const q = f(x, dd); return [X0 + q[0], Y0 + q[1]]; }; };
  let bw, bh;
  if (L === 'I') { bw = len(0); bh = Math.max(d.baseD, d.tallD) + 14; }
  else if (L === 'L') { bw = len(1); bh = len(0); }
  else if (L === 'P' || L === 'S') { bw = Math.max(len(0), len(1)); bh = M.roomDepth(P); }
  else { bw = len(1); bh = Math.max(len(0), len(2)); }
  const vw = bw + 2 * X0, vh = bh + 2 * Y0;
  const fs = Math.max(8, vw / 32);
  const col = P.finish.colors, doorC = col.door, lineC = shade(doorC, -0.5);
  const pts = a => a.map(q => `${r1(q[0])},${r1(q[1])}`).join(' ');
  const rectP = (wi, x0, x1, d0, d1) => { const f = TR(wi); return pts([f(x0, d0), f(x1, d0), f(x1, d1), f(x0, d1)]); };
  let s = `<rect width="${vw}" height="${vh}" fill="#fff"/>`;
  /* floor */
  if (L === 'I') s += `<polygon points="${pts([[X0, Y0], [X0 + len(0), Y0], [X0 + len(0), Y0 + bh - 14 + 14], [X0, Y0 + bh]])}" fill="#fbf9f4"/>`;
  else s += `<rect x="${X0}" y="${Y0}" width="${bw}" height="${bh}" fill="#fbf9f4"/>`;
  /* upper cabinets (dashed) */
  P.walls.forEach((W, wi) => {
    M.place(P, wi, 'upper').placed.forEach(p => {
      if (p.it.type === 'gap') return;
      s += `<polygon points="${rectP(wi, p.x0, p.x1, 0, d.upperD)}" fill="none" stroke="#999" stroke-width=".8" stroke-dasharray="3 2"/>`;
    });
  });
  /* base cabinets */
  P.walls.forEach((W, wi) => {
    M.place(P, wi, 'base').placed.forEach(p => {
      if (p.it.type === 'gap') {
        if (['fridge', 'dishwasher', 'oven', 'hob'].includes(p.it.label)) s += `<polygon points="${rectP(wi, p.x0, p.x1, 0, d.baseD)}" fill="#eef3f6" stroke="#8aa" stroke-width=".7" stroke-dasharray="3 2"/>`;
        if (p.it.label === 'panel') { const pn = M.panels(P, wi).find(q => q.it === p.it); if (pn) s += `<polygon points="${rectP(wi, p.x0, p.x1, 0, pn.depth)}" fill="${M.doorColor(P, p.it, 'base')}" stroke="${lineC}" stroke-width=".7"/>`; }
        return;
      }
      const tall = p.it.type === 'tall';
      s += `<polygon points="${rectP(wi, p.x0, p.x1, 0, tall ? d.tallD : d.baseD)}" fill="${tall ? shade(M.doorColor(P, p.it, 'base'), -0.12) : M.doorColor(P, p.it, 'base')}" stroke="${lineC}" stroke-width=".7"/>`;
    });
  });
  /* corners */
  P.corners.forEach((c, j) => {
    const f = TR(j), ln = len(j);
    const poly = (a, b, D, fill, dash) => {
      const q = [f(ln - a, 0), f(ln, 0), f(ln, b), f(ln - D, b), f(ln - D, D), f(ln - a, D)];
      return `<polygon points="${pts(q)}" fill="${fill}" stroke="${dash ? '#999' : lineC}" stroke-width="${dash ? .8 : .7}"${dash ? ' stroke-dasharray="3 2"' : ''}/>`;
    };
    s += poly(num(c.a), num(c.b), d.baseD, shade(doorC, -0.07), false);
    s += poly(num(c.aw), num(c.bw), d.upperD, 'none', true);
  });
  /* walls */
  const wl = [];
  if (L === 'I' || L === 'S') wl.push([TR(0)(0, 0), TR(0)(len(0), 0)]);
  else P.walls.forEach((W, wi) => wl.push([TR(wi)(0, 0), TR(wi)(len(wi), 0)]));
  wl.forEach(a => { s += `<line x1="${r1(a[0][0])}" y1="${r1(a[0][1])}" x2="${r1(a[1][0])}" y2="${r1(a[1][1])}" stroke="#444" stroke-width="3.2" stroke-linecap="square"/>`; });
  /* obstacles */
  P.walls.forEach((W, wi) => {
    const f = TR(wi);
    (W.obs || []).forEach(o => {
      const x0 = num(o.x), x1 = x0 + num(o.w);
      if (o.type === 'window') s += `<polygon points="${rectP(wi, x0, x1, -2.2, 2.2)}" fill="#7fb6e0" stroke="#3f77a3" stroke-width=".6"/>`;
      else if (o.type === 'door') s += `<polygon points="${rectP(wi, x0, x1, -2.2, 2.2)}" fill="#c8a27c" stroke="#8a6a48" stroke-width=".6"/>`;
      else if (o.type === 'column') s += `<polygon points="${rectP(wi, x0, x1, 0, num(o.depth) || 25)}" fill="#c4c4c4" stroke="#777" stroke-width=".8"/>`;
      else s += `<polygon points="${rectP(wi, x0, x1, -2, 2)}" fill="#f4a63a" stroke="#b8731a" stroke-width=".4"/>`;
    });
    /* one label per wall, outside the wall line (rotated for vertical walls) */
    const fr = M.frame(P, wi), vertical = fr.vertical;
    const q = f(len(wi) / 2, -12);
    const label = (P.walls.length > 1 ? (fr.island ? t('wall.island') : t('wall.n', { n: wi + 1 })) + ' · ' : '') + r1(len(wi));
    const rot = vertical ? ` transform="rotate(${fr.rot} ${r1(q[0])} ${r1(q[1])})"` : '';
    s += `<text x="${r1(q[0])}" y="${r1(q[1] + fs * 0.35)}" font-size="${r1(fs)}" fill="#333" text-anchor="middle" font-weight="700"${rot}>${esc(label)}</text>`;
  });
  return { w: vw, h: vh, body: s };
}

/* ---------------- one cutting sheet ---------------- */
function sheet(sh, L0, W0, color) {
  const L = sh.L || L0, W = sh.W || W0;
  const fs = Math.max(4.5, L / 60), ew = Math.max(1, L / 200);
  let s = `<rect width="${L}" height="${W}" fill="#fff" stroke="#333" stroke-width="1"/>`;
  (sh.off || []).forEach(o => { s += `<rect x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" fill="#eef7ee" stroke="#4a8" stroke-width=".6" stroke-dasharray="3 2"/>`; });
  sh.pieces.forEach(p => {
    s += `<rect x="${r1(p.x)}" y="${r1(p.y)}" width="${r1(p.w)}" height="${r1(p.h)}" fill="${color}" stroke="#6b4a1f" stroke-width=".5"/>`;
    const ln = (x1, y1, x2, y2) => `<line x1="${r1(x1)}" y1="${r1(y1)}" x2="${r1(x2)}" y2="${r1(y2)}" stroke="#d62828" stroke-width="${r1(ew)}" stroke-linecap="butt"/>`;
    if (p.ebH > 0) s += ln(p.x, p.y + ew / 2, p.x + p.w, p.y + ew / 2); if (p.ebH > 1) s += ln(p.x, p.y + p.h - ew / 2, p.x + p.w, p.y + p.h - ew / 2);
    if (p.ebV > 0) s += ln(p.x + ew / 2, p.y, p.x + ew / 2, p.y + p.h); if (p.ebV > 1) s += ln(p.x + p.w - ew / 2, p.y, p.x + p.w - ew / 2, p.y + p.h);
    const f1 = Math.min(fs, p.h / 2.4, p.w / 5);
    if (f1 > 2.3) {
      s += `<text x="${r1(p.x + p.w / 2)}" y="${r1(p.y + p.h / 2 - 0.2)}" font-size="${r1(f1)}" text-anchor="middle" fill="#222" font-weight="700" direction="ltr">${esc(p.code)}</text>`;
      s += `<text x="${r1(p.x + p.w / 2)}" y="${r1(p.y + p.h / 2 + f1 * 1.05)}" font-size="${r1(f1 * 0.85)}" text-anchor="middle" fill="#444">${r1(p.w)}×${r1(p.h)}</text>`;
    }
  });
  (sh.strips || []).forEach((st, i) => { s += `<text x="${r1(L - 1.5)}" y="${r1(st.y + Math.min(st.h, fs * 1.6) * 0.8)}" font-size="${r1(fs * 1.1)}" text-anchor="end" fill="#a33" font-weight="700">${i + 1}</text>`; });
  return { w: L, h: W, body: s };
}

/* a tiny part sketch for labels: rectangle with banded edges in red */
function partMini(p, w) {

function deepAssign(base, over) {
  const out = JSON.parse(JSON.stringify(base));
  if (over && typeof over === 'object') Object.keys(over).forEach(k => {
    if (over[k] && typeof over[k] === 'object' && !Array.isArray(over[k]) && out[k] && typeof out[k] === 'object') out[k] = deepAssign(out[k], over[k]);
    else out[k] = over[k];

  return out;
}
function norm(P) {

  { const HX = /^#[0-9a-fA-F]{6}$/, c = P.finish.colors; if (!HX.test(c.doorUp || '')) c.doorUp = ''; if (!HX.test(c.handle || '')) c.handle = B.finish.colors.handle;
    P.handle = deepAssign(B.handle, P.handle); ['len', 'lenDr', 'w'].forEach(k => { const x = M.num(P.handle[k]); P.handle[k] = x > 0 ? x : B.handle[k]; }); }

  P.price.mode = P.price.mode === 'piece' ? 'piece' : 'meter'; P.price.cur = P.price.cur === 'B' ? 'B' : 'A';
  P.layout = M.LAYOUTS.includes(P.layout) ? P.layout : 'I';
  const n = M.NW[P.layout];
  P.walls = (Array.isArray(P.walls) ? P.walls : []).slice(0, n);
  while (P.walls.length < n) P.walls.push(M.newWall(300));
  P.walls.forEach(w => {
    w.len = M.num(w.len) || 300; w.slope = deepAssign({ diff: 0, high: 'L' }, w.slope); w.slope.diff = M.num(w.slope.diff);
    ['base', 'upper', 'obs'].forEach(k => { if (!Array.isArray(w[k])) w[k] = []; });
    ['base', 'upper'].forEach(k => w[k].forEach(it => { it.h = M.num(it.h); it.bot = M.num(it.bot); it.hob = !!it.hob; it.w = M.num(it.w); it.n = Math.max(1, Math.round(M.num(it.n)) || 1); it.type = it.type || 'door'; it.label = it.label || ''; if (!/^#[0-9a-fA-F]{6}$/.test(it.dc || '')) delete it.dc; }));
    w.obs.forEach(o => { o.x = M.num(o.x); o.w = M.num(o.w); o.h = M.num(o.h); o.sill = M.num(o.sill); o.depth = M.num(o.depth); });
  });

  while (P.corners.length < nc) P.corners.push(M.defCorner());
  P.corners.forEach(c => { ['a', 'b', 'aw', 'bw'].forEach(k => { c[k] = M.num(c[k]); }); });
  P.hw = deepAssign(M.DEF_HW, P.hw); M.HW_NUM.forEach(k => { const v = P.hw[k]; P.hw[k] = (v === '' || v == null || !isFinite(M.num(v))) ? M.DEF_HW[k] : M.num(v); }); ['slideLen', 'clear', 'sideH'].forEach(k => { P.hw[k] = M.num(P.hw[k]); }); if (!M.SLIDE_TYPES[P.hw.slide]) P.hw.slide = 'ball'; if (!['full', 'half', 'inset'].includes(P.hw.hinge)) P.hw.hinge = 'full';

  P.photos = (Array.isArray(P.photos) ? P.photos : []).filter(x => x && x.id).map(x => ({ id: String(x.id), note: String(x.note || ''), ts: x.ts || Date.now() }));
  P.brand = deepAssign({ slide: '', hinge: '' }, P.brand);
  P.quote = deepAssign(B.quote, P.quote); P.quote.valid = M.num(P.quote.valid); P.quote.downPct = Math.min(100, M.num(P.quote.downPct)); P.quote.inst = Math.max(0, Math.round(M.num(P.quote.inst)));
  P.price.extras.forEach(e => { if (e.price == null) { e.price = M.num(e.amount); e.qty = 1; } e.qty = M.num(e.qty == null ? 1 : e.qty); e.price = M.num(e.price); e.name = String(e.name || ''); });
  return P;

function migrateV1() {

    const d = P.dims;

    P.walls[0].upper = (o.wall || []).map(m => ({ w: M.num(m.w), type: 'door', n: Math.max(1, M.num(m.n)), label: '' }));

function load() {

const IDB = (() => {

  }));

function imgToBlob(file, maxSide, q) {

    const u = URL.createObjectURL(file), img = new Image();

}

function dlt(a, b) { // keep only what differs from the blank project

}
function mrg(b, d) { if (isO(d) && isO(b)) { const o = Object.assign({}, b); for (const k in d) o[k] = mrg(b[k], d[k]); return o; } return d; }

async function packShare(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  const plain = 'p.' + b64u(bytes);
  try {
    if (window.CompressionStream && plain.length > 250) { const z = 'z.' + b64u(await pipeBytes(bytes, new CompressionStream('deflate-raw'))); if (z.length < plain.length) return z; }

function svgToPng(svg, w, h) {
  return new Promise((res, rej) => {
    const scale = Math.min(2, Math.sqrt(12e6 / (w * h)));
    const img = new Image(); const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml;charset=utf-8' }));
    img.onload = () => {

      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); c.toBlob(b => (b ? res(b) : rej(new Error('toBlob'))), 'image/png');

    img.src = url;

}

function readLogo(file) {
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const m = 256; const sc = Math.min(1, m / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      S.shop.logo = c.toDataURL('image/png'); save(); render();
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}
